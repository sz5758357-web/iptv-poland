<!-- DOLNY PASEK MOBILNY -->
<nav class="mobile-nav">
    <button class="mob-btn active" onclick="switchTab('player', this)">
        <span>📺</span> Odtwarzacz
    </button>
    <button class="mob-btn" onclick="switchTab('channels', this)">
        <span>📑</span> Kanały
    </button>
    <button class="mob-btn" onclick="switchTab('categories', this)">
        <span>📁</span> Kategorie
    </button>
</nav>

<script>
// Prosta funkcja przełączania zakładek na telefonie
function switchTab(tab, btn) {
    document.querySelectorAll('.mob-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const sidebar = document.querySelector('.sidebar');
    const content = document.querySelector('.content');
    const channelsPanel = document.querySelector('.channels');

    if (window.innerWidth <= 768) {
        sidebar.style.display = 'none';
        content.style.display = 'none';
        channelsPanel.style.display = 'none';

        if (tab === 'player') {
            content.style.display = 'flex';
        } else if (tab === 'channels') {
            channelsPanel.style.display = 'block';
        } else if (tab === 'categories') {
            sidebar.style.display = 'block';
            sidebar.style.width = '100%';
        }
    }
}

// Inicjalizacja widoku mobilnego po załadowaniu
window.addEventListener('DOMContentLoaded', () => {
    if (window.innerWidth <= 768) {
        document.querySelector('.sidebar').style.display = 'none';
        document.querySelector('.channels').style.display = 'none';
    }
});
</script>
